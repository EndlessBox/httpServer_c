name: Pull request service labeling
on:
    - pull_request

jobs:
  pr-labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - run: |
         {
            # Parse changeset
            IN_PLACE_LABELS=${{ github.event.pull_request.labels.*.name }}
            echo "$IN_PLACE_LABELS"
            SERVICES=$(cat *.md | grep -oP '^"\S+": (patch|minor|major)$' | grep -oP "\"\K.+(?=\")" | grep -v '^@')
            echo "$SERVICES"
         } >> "$GITHUB_OUTPUT"

