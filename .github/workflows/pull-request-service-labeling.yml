name: Pull request service labeling
on:
  pull_request

jobs:
  pr-labeler:
    permissions:
      contents: write
      pull-requests: write
      repository-projects: read
    runs-on: ubuntu-latest
    steps:
          - uses: actions/checkout@v4
          - run: gh pr edit ${{ github.head_ref }} --add-label "casino-free-spins,test,test1"
            id: add_label_to_branch
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH_NAME: ${{ github.head_ref }}
