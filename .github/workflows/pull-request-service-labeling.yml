name: Pull request service labeling
on:
  pull_request:
    branches:
      - master

jobs:
  pr-labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - run: gh pr edit --add-label "casino-free-spins,test,test1"
    env:
      GH_TOKEN: ${{ github.token }}
